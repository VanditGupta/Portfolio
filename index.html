<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vandit Gupta | AI Engineer</title>
    <meta
      name="description"
      content="Vandit Gupta is a Full Stack AI Engineer at New York Life building enterprise RAG search, voice AI coaching and agentic systems on AWS."
    />
    <meta property="og:title" content="Vandit Gupta | AI Engineer" />
    <meta
      property="og:description"
      content="Production AI infrastructure: RAG search, voice AI coaching and agentic platforms."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vanditgupta.com/" />
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
